name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # server and end-to-end tests run against a real local Supabase (Docker on the runner)
      - run: npm run test:server
      - run: npm run test:e2e
      - run: npm run coverage:stories
